# workflow to build and test sea-dsa

name: CI

# Run CI on pushes to main and on pull requests targeting main.
# Each dev<N> branch carries its own copy of this workflow, scoped to itself and
# pinned to its own LLVM version, so listing those branches here would be a no-op:
# GitHub resolves workflow files from the pushed branch (push) or the base branch
# (pull_request), never from main.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "test"
  test:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks out the triggering commit (push) or PR merge ref (pull_request)
      - name: Check out repo
        uses: actions/checkout@v4
      # The Dockerfile builds seadsa and runs the test targets (test-sea-dsa
      # for lit tests and sea-dsa-units for unit tests), so a failing test
      # fails the build.
      - name: Build seadsa and run tests
        run: docker build -t seahorn/sea-dsa-builder:jammy-llvm14 -f docker/sea-dsa-builder.Dockerfile .
